server:
  port: 9090
  servlet:
    context-path: /api/ragent

spring:
  application:
    name: ragent${unique-name:}-service

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  datasource:
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    username: postgres
    password: postgres
    url: jdbc:postgresql://127.0.0.1:5432/ragent?client_encoding=UTF8
    hikari:
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 10
      minimum-idle: 5
      pool-name: RagentHikariPool

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: ragent-producer${unique-name:}_pg
    send-message-timeout: 2000

milvus:
  uri: http://localhost:19530

rag:
  vector:
    type: milvus  # 可选 milvus / pg

  default:
    collection-name: rag_default_store
    dimension: 4096
    metric-type: COSINE

  query-rewrite:
    enabled: true
    max-history-messages: 4
    max-history-chars: 500

  rate-limit:
    global:
      enabled: true
      max-concurrent: 1
      max-wait-seconds: 3
      lease-seconds: 30
      poll-interval-ms: 200

  memory:
    history-keep-turns: 4
    summary-start-turns: 5
    summary-enabled: true
    ttl-minutes: 60
    summary-max-chars: 200
    title-max-length: 30

  semaphore:
    document-upload:
      name: rag:document:upload
      max-concurrent: 10
      max-wait-seconds: 5
      lease-seconds: 300

  knowledge:
    schedule:
      scan-delay-ms: 10000
      lock-seconds: 900
      batch-size: 20
      min-interval-seconds: 60

  mcp:
    servers:
      - name: default
        url: http://localhost:9099

  search:
    channels:
      vector-global:
        confidence-threshold: 0.6
        top-k-multiplier: 3
      intent-directed:
        min-intent-score: 0.4
        top-k-multiplier: 2

  trace:
    enabled: true
    max-error-length: 1000

ai:
  providers:
    ollama:
      url: http://localhost:11434
      endpoints:
        chat: /v1/chat/completions
        rerank: /v1/chat/completions
        embedding: /api/embed
    bailian:
      url: https://dashscope.aliyuncs.com
      api-key: ${BAILIAN_API_KEY:}
      endpoints:
        chat: /compatible-mode/v1/chat/completions
        rerank: /api/v1/services/rerank/text-rerank/text-rerank
    siliconflow:
      url: https://api.siliconflow.cn
      api-key: ${SILICONFLOW_API_KEY:}
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings
    vllm:
      url: http://192.168.1.19:9001
      api-key: ${VLLM_API_KEY:sk-local}
      endpoints:
        chat: ${VLLM_CHAT_URL:http://192.168.1.19:9001/v1/chat/completions}
        embedding: ${VLLM_EMBEDDING_URL:http://192.168.1.19:9002/v1/embeddings}
        rerank: ${VLLM_RERANK_URL:http://192.168.1.24:9003/v1/rerank}

  selection:
    failure-threshold: 2
    open-duration-ms: 30000

  stream:
    message-chunk-size: 1

  chat:
    default-model: qwen3-vllm
    deep-thinking-model: qwen3-vllm
    candidates:
      - id: qwen3-vllm
        provider: vllm
        model: ${VLLM_CHAT_MODEL:qwen3-8b}
        url: ${VLLM_CHAT_URL:http://192.168.1.19:9001/v1/chat/completions}
        supports-thinking: true
        priority: 0

  embedding:
    default-model: qwen3-embedding-vllm
    candidates:
      - id: qwen3-embedding-vllm
        provider: vllm
        model: ${VLLM_EMBEDDING_MODEL:qwen3-embedding-8b}
        url: ${VLLM_EMBEDDING_URL:http://192.168.1.19:9002/v1/embeddings}
        dimension: ${rag.default.dimension}
        priority: 0

  rerank:
    default-model: qwen3-reranker-vllm
    candidates:
      - id: qwen3-reranker-vllm
        provider: vllm
        model: ${VLLM_RERANK_MODEL:qwen3-reranker-8b}
        url: ${VLLM_RERANK_URL:http://192.168.1.24:9003/v1/rerank}
        priority: 0
      - id: rerank-noop
        provider: noop
        model: noop
        priority: 100

rustfs:
  url: http://localhost:9000
  access-key-id: rustfsadmin
  secret-access-key: rustfsadmin

sa-token:
  token-name: Authorization
  timeout: 2592000
  is-concurrent: true
  is-share: false
  token-style: simple-uuid
  is-log: false
  is-print: false

app:
  demo-mode: false
